# yaml-languuage-server: $shema=https://json.schemastore.org/github-workflow.json
---
name: Lint

on:
  pull_request:
    branches:
      - main

concurrency:
  group: workstation-lint
  cancel-in-progress: true

jobs:
  lint:
    name: Ansible lint
    runs-on: infra
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          pip3 install -r requirements.txt
          ansible-lint --profile production --project-dir .
