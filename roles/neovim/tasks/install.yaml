---
- name: Install (MacOS)
  when: ansible_facts['os_family'] == "Darwin"
  community.general.homebrew:
    name: "{{ _neovim_packages }}"
    state: present

- name: Ensure directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim"
    state: directory
    mode: "0755"
