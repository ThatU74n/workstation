---
- name: Install Git (MacOS)
  when: ansible_facts['os_family'] == 'Debian'
  community.general.homebrew:
    name: "{{ _git_packages }}"
    state: present

- name: Install Git (Debian)
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.apt:
    name: "{{ _git_packages }}"
    state: present
