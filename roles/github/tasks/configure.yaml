---
- name: Copy configuration files
  ansible.builtin.copy:
    src: config.yaml
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/gh/config.yaml"
    mode: '0600'

- name: Ensure alias
  ansible.builtin.blockinfile:
    path: "{{ _github_shell_profile }}"
    create: true
    block: |
      alias pr="gh pr create --draft --base develop --editor --template PULL_REQUEST_TEMPLATE.md"
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    owner: "{{ ansible_facts['env']['USER'] }}"
    mode: "0644"
